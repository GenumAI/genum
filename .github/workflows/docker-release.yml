name: Docker Build and Push on Release

on:
  release:
    types: [published]

# Never cancel a release that is already running: a half-published set of images
# is worse than a queued one.
concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_IMAGE_PREFIX: ${{ secrets.DOCKER_HUB_USERNAME || 'genum' }}

jobs:
  # Gate for the whole release: runs the checks, then resolves the version once so
  # the build jobs below do not each repeat that logic.
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.repository.fork == false && (github.event.release.target_commitish == 'main' || github.event.release.target_commitish == 'refs/heads/main')
    outputs:
      # Only the version travels between jobs. Image tags embed
      # secrets.DOCKER_HUB_USERNAME, and GitHub drops any job output containing a
      # secret ("Skip output ... since it may contain secret"), which silently
      # yields an empty tag and "tag is needed when pushing to registry".
      # Each job computes its own tags instead.
      tag: ${{ steps.release_version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
          # Full history so the tag can be verified against main below.
          fetch-depth: 0

      - name: Verify tag is on main branch
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if ! git branch -r --contains "$TAG" | grep -q "origin/main"; then
            echo "Error: Release tag $TAG is not on main branch"
            exit 1
          fi
          echo "✓ Tag $TAG is on main branch"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter core db:generate

      - name: Run Biome linter (core)
        run: pnpm biome check apps/core

      # Through turbo, not `pnpm --filter core test:run`: every entry point of
      # @genum/placeholders resolves into its dist/, which a clean checkout does not
      # have. Calling vitest directly skips the task graph, so vite cannot resolve the
      # package and three suites error out. That is how v1.10.0 shipped with no images.
      - name: Run unit tests (core, web)
        run: pnpm turbo run test:run --filter=core --filter=web

      - name: Extract release version
        id: release_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ ! "$TAG" =~ ^v ]]; then
            echo "Error: Release tag must start with 'v' (e.g., v1.0.0)"
            exit 1
          fi
          VERSION=${TAG#v}
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

  # One leg per image per architecture, each on a runner of that architecture.
  #
  # This used to be two jobs that each asked buildx for linux/amd64,linux/arm64 on an
  # x86 runner, with QEMU emulating aarch64. The core image cannot avoid running arm64
  # code at build time — its runtime stage installs production dependencies, and both
  # bcrypt (native addon) and the prisma CLI (per-platform binaries) have to be the
  # target's, so that stage cannot be pinned to $BUILDPLATFORM the way the builder
  # stages are. Under emulation that step died with
  # "qemu: uncaught target signal 4 (Illegal instruction)" on roughly every other
  # release, with identical inputs between a success and a failure (same binfmt digest,
  # same base image, same lockfile) — i.e. the variance was inside QEMU, not in
  # anything we could pin. The web image never failed, because its runtime stage is
  # nginx:alpine and runs nothing.
  #
  # GitHub's arm64 Linux runners are free for public repositories, so each platform now
  # builds natively and QEMU is gone. Nothing is tagged here: each leg pushes an
  # untagged image by digest, and the merge job below assembles the multi-arch tag once
  # both digests exist. A failed leg therefore publishes nothing half-finished.
  build:
    needs: test-and-lint
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: core
            dockerfile: ./apps/core/dockerfile
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - component: core
            dockerfile: ./apps/core/dockerfile
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - component: web
            dockerfile: ./apps/web/Dockerfile
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - component: web
            dockerfile: ./apps/web/Dockerfile
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Compute image name
        id: image
        env:
          IMAGE_BASE: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_PREFIX }}
          COMPONENT: ${{ matrix.component }}
        run: echo "name=$IMAGE_BASE/$COMPONENT" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            RELEASE_VERSION=${{ needs.test-and-lint.outputs.tag }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.component }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      # Pulls the compiled output straight out of the image just built, instead of
      # repeating the build natively on the runner: the builder layers are still in
      # this runner's cache. The output is architecture-independent JavaScript, so the
      # amd64 leg alone is enough and the arm64 leg skips this.
      - name: Extract dist for source maps
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: dist
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=./dist-artifact

      - name: Upload dist for source maps
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.component }}
          path: ./dist-artifact
          if-no-files-found: error
          retention-days: 1

  # Assembles the per-architecture digests into one tagged multi-arch manifest. This is
  # the only step that creates a tag, so `:latest` never points at a half-built release.
  publish:
    needs: [test-and-lint, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [core, web]

    steps:
      # Only the Sentry step needs this, and it needs the full history: `set-commits --auto`
      # resolves the commit range since the previous release from the repository in the
      # working directory, so a shallow clone or no clone at all fails the whole action --
      # taking the source-map upload with it, since that runs after set-commits.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.component }}-*
          merge-multiple: true

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        env:
          IMAGE_BASE: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_PREFIX }}
          COMPONENT: ${{ matrix.component }}
          VERSION: ${{ needs.test-and-lint.outputs.tag }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          IMAGE="$IMAGE_BASE/$COMPONENT"
          TAG_ARGS=(-t "$IMAGE:$VERSION")
          if [[ "$IS_PRERELEASE" == "false" ]]; then
            TAG_ARGS+=(-t "$IMAGE:latest")
          fi
          SOURCES=()
          shopt -s nullglob
          for f in *; do
            SOURCES+=("$IMAGE@sha256:$f")
          done
          if [[ ${#SOURCES[@]} -eq 0 ]]; then
            echo "Error: no digests were downloaded for $COMPONENT"
            exit 1
          fi
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCES[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

      - name: Download dist for source maps
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.component }}
          path: ./dist-artifact

      # Deliberately non-fatal: the images are already tagged and pushed by this point, so
      # failing the job over telemetry would report a release that in fact shipped. The
      # summary below states the real outcome instead, because a green run that silently
      # skipped the source-map upload is how this went unnoticed in v1.11.0.
      - name: Create Sentry release
        id: sentry
        continue-on-error: true
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ matrix.component == 'core' && secrets.SENTRY_PROJECT_CORE || secrets.SENTRY_PROJECT_WEB }}
        with:
          environment: production
          release: ${{ needs.test-and-lint.outputs.tag }}
          sourcemaps: ./dist-artifact

      - name: Summary
        env:
          COMPONENT: ${{ matrix.component }}
          TAG: ${{ needs.test-and-lint.outputs.tag }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          IMAGE_BASE: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_PREFIX }}
          SENTRY_OUTCOME: ${{ steps.sentry.outcome }}
        run: |
          {
            echo "### 🐳 $COMPONENT"
            echo "- \`$IMAGE_BASE/$COMPONENT:$TAG\` (linux/amd64, linux/arm64)"
            if [[ "$IS_PRERELEASE" == "false" ]]; then
              echo "- \`$IMAGE_BASE/$COMPONENT:latest\`"
            else
              echo "- (latest tag skipped for prerelease)"
            fi
            if [[ "$SENTRY_OUTCOME" == "success" ]]; then
              echo "- Sentry release: \`$TAG\`"
            else
              echo "- ⚠️ Sentry release **failed** ($SENTRY_OUTCOME) — no source maps for \`$TAG\`, so stack traces stay minified. See the step log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
