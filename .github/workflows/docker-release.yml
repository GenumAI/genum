name: Docker Build and Push on Release

on:
  release:
    types: [published]

# Never cancel a release that is already running: a half-published set of images
# is worse than a queued one.
concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_IMAGE_PREFIX: ${{ secrets.DOCKER_HUB_USERNAME || 'genum' }}

jobs:
  # Gate for the whole release: runs the checks, then resolves the version and image
  # tags once so the two build jobs below do not each repeat that logic.
  test-and-lint:
    runs-on: ubuntu-latest
    if: github.event.repository.fork == false && (github.event.release.target_commitish == 'main' || github.event.release.target_commitish == 'refs/heads/main')
    outputs:
      # Only the version travels between jobs. Image tags embed
      # secrets.DOCKER_HUB_USERNAME, and GitHub drops any job output containing a
      # secret ("Skip output ... since it may contain secret"), which silently
      # yields an empty tag and "tag is needed when pushing to registry".
      # Each build job computes its own tags instead.
      tag: ${{ steps.release_version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
          # Full history so the tag can be verified against main below.
          fetch-depth: 0

      - name: Verify tag is on main branch
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if ! git branch -r --contains "$TAG" | grep -q "origin/main"; then
            echo "Error: Release tag $TAG is not on main branch"
            exit 1
          fi
          echo "✓ Tag $TAG is on main branch"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter core db:generate

      - name: Run Biome linter (core)
        run: pnpm biome check apps/core

      # Through turbo, not `pnpm --filter core test:run`: every entry point of
      # @genum/placeholders resolves into its dist/, which a clean checkout does not
      # have. Calling vitest directly skips the task graph, so vite cannot resolve the
      # package and three suites error out. That is how v1.10.0 shipped with no images.
      - name: Run unit tests (core)
        run: pnpm turbo run test:run --filter=core

      - name: Extract release version
        id: release_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ ! "$TAG" =~ ^v ]]; then
            echo "Error: Release tag must start with 'v' (e.g., v1.0.0)"
            exit 1
          fi
          VERSION=${TAG#v}
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"


  build-core:
    runs-on: ubuntu-latest
    needs: test-and-lint
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Compute image tags
        id: image_tags
        env:
          IMAGE_BASE: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_PREFIX }}
          VERSION: ${{ needs.test-and-lint.outputs.tag }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          TAGS="$IMAGE_BASE/core:$VERSION"
          if [[ "$IS_PRERELEASE" == "false" ]]; then
            TAGS="$TAGS,$IMAGE_BASE/core:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push Core image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/core/dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RELEASE_VERSION=${{ needs.test-and-lint.outputs.tag }}
          tags: ${{ steps.image_tags.outputs.tags }}

      # Pulls the compiled output straight out of the image just built, instead of
      # repeating the build natively on the runner. Reuses the builder layers from
      # the step above, and is architecture-independent, so one platform is enough.
      - name: Extract Core dist for source maps
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/core/dockerfile
          target: dist
          platforms: linux/amd64
          outputs: type=local,dest=./apps/core/dist

      - name: Create Sentry release for Core
        continue-on-error: true
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_CORE }}
        with:
          environment: production
          release: ${{ needs.test-and-lint.outputs.tag }}
          sourcemaps: ./apps/core/dist

      - name: Summary
        env:
          TAG: ${{ needs.test-and-lint.outputs.tag }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          IMAGE_BASE: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_PREFIX }}
        run: |
          {
            echo "### 🐳 Core"
            echo "- \`$IMAGE_BASE/core:$TAG\`"
            if [[ "$IS_PRERELEASE" == "false" ]]; then
              echo "- \`$IMAGE_BASE/core:latest\`"
            else
              echo "- (latest tag skipped for prerelease)"
            fi
            echo "- Sentry release: \`$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-web:
    runs-on: ubuntu-latest
    needs: test-and-lint
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Compute image tags
        id: image_tags
        env:
          IMAGE_BASE: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_PREFIX }}
          VERSION: ${{ needs.test-and-lint.outputs.tag }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          TAGS="$IMAGE_BASE/web:$VERSION"
          if [[ "$IS_PRERELEASE" == "false" ]]; then
            TAGS="$TAGS,$IMAGE_BASE/web:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RELEASE_VERSION=${{ needs.test-and-lint.outputs.tag }}
          tags: ${{ steps.image_tags.outputs.tags }}

      # See the note in build-core: same trick, reusing the builder layers instead
      # of running `vite build` a second time on the runner.
      - name: Extract Web dist for source maps
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web/Dockerfile
          target: dist
          platforms: linux/amd64
          outputs: type=local,dest=./apps/web/dist

      - name: Create Sentry release for Web
        continue-on-error: true
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_WEB }}
        with:
          environment: production
          release: ${{ needs.test-and-lint.outputs.tag }}
          sourcemaps: ./apps/web/dist

      - name: Summary
        env:
          TAG: ${{ needs.test-and-lint.outputs.tag }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          IMAGE_BASE: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_PREFIX }}
        run: |
          {
            echo "### 🐳 Web"
            echo "- \`$IMAGE_BASE/web:$TAG\`"
            if [[ "$IS_PRERELEASE" == "false" ]]; then
              echo "- \`$IMAGE_BASE/web:latest\`"
            else
              echo "- (latest tag skipped for prerelease)"
            fi
            echo "- Sentry release: \`$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
